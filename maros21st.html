const app=document.getElementById('app'), key='maro21-quiz-v2'; let pos=0,answers=[],name='',submitted=false,messages=['','',''];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function welcome(){app.innerHTML=`<div class="ribbon">🎀</div><div class="eyebrow">The birthday edition · 21</div><h1>How well do you<br>really know me?</h1><p>22 quiz questions + 3 little love notes. One chance. No pressure, bestie.</p><div class="photos"><div class="photo"><img src="${photos[1]}" alt="Little Maro">Little Maro</div><div class="photo"><img src="${photos[0]}" alt="Maro at 21">Chapter 21</div></div><label for="name">Your name, please ♡</label><input id="name" maxlength="80" placeholder="Enter your name" autocomplete="given-name"><button id="start">Let's see if you actually know me 💋</button><p class="muted">One attempt per browser · Results at the end only</p>`;document.getElementById('start').onclick=()=>{name=document.getElementById('name').value.trim();if(!name){document.getElementById('name').focus();return}render()}}
function render(){const [q,opts]=qs[pos];app.innerHTML=`<div class="eyebrow">Chapter 21 · Question ${pos+1} of ${qs.length}</div><div class="track"><div class="fill" style="width:${(pos+1)/qs.length*100}%"></div></div><h2>${esc(q)}</h2><div role="group" aria-label="Answer choices">${opts.map((o,i)=>`<button class="option ${answers[pos]===i?'selected':''}" aria-pressed="${answers[pos]===i}" data-i="${i}">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')}</div><div class="nav">${pos>0?'<button id="back">Back</button>':''}<button id="next" ${answers[pos]===undefined?'disabled':''}>${pos===qs.length-1?'Continue to love notes ♡':'Next question'}</button></div><p class="muted">No answers revealed until the end.</p>`;app.querySelectorAll('.option').forEach(b=>b.onclick=()=>{answers[pos]=Number(b.dataset.i);render()});if(pos>0)document.getElementById('back').onclick=()=>{pos--;render()};document.getElementById('next').onclick=()=>{if(pos<qs.length-1){pos++;render()}else letters()}}
const prompts=["What's one wish you have for me as I turn 21?","If you could tell 21-year-old me one thing, what would it be?","What's one thing you hope never changes about me?"];
function letters(){app.innerHTML=`<div class="ribbon">💌</div><div class="eyebrow">A little love for chapter 21</div><h2>Before you go...</h2><p>Three little notes for my next chapter. No right or wrong answers here.</p><div class="letter">${prompts.map((q,i)=>`<label for="note${i}">${esc(q)}</label><textarea id="note${i}" maxlength="3000" placeholder="Write something from the heart...">${esc(messages[i])}</textarea>`).join('')}</div><p class="muted">Your name, answers, score and notes will be shared privately with Maro. Love notes are optional and do not affect your score.</p><div class="nav"><button id="back">Back</button><button id="submit">Submit my answers ♡</button></div><p id="error" class="error" role="alert"></p>`;prompts.forEach((_,i)=>document.getElementById('note'+i).oninput=e=>messages[i]=e.target.value);document.getElementById('back').onclick=()=>render();document.getElementById('submit').onclick=submitAll;}
async function submitAll(){if(submitted||!confirm('Ready to submit? You cannot retake the quiz after submitting.'))return;const score=qs.reduce((s,q,i)=>s+Number(q[2].includes(answers[i])),0);const result={name,score};const btn=document.getElementById('submit'),back=document.getElementById('back');btn.disabled=back.disabled=true;btn.textContent='Sending your answers...';const data=new URLSearchParams({'form-name':'birthday-responses','bot-field':'',name,score:score+'/'+qs.length,wish:messages[0],advice:messages[1],'never-change':messages[2]});qs.forEach((q,i)=>data.set('q'+(i+1),String.fromCharCode(65+answers[i])+'. '+q[1][answers[i]]));try{if(location.protocol==='file:'){result.preview=true;}else{if(location.hostname.endsWith('github.io'))throw Error('Response collection not connected');const res=await fetch('/',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:data.toString()});if(!res.ok)throw Error('Submission failed');}submitted=true;try{localStorage.setItem(key,JSON.stringify(result))}catch(e){}show(result)}catch(e){document.getElementById('error').textContent=location.hostname.endsWith('github.io')?'Response collection is not connected yet. Please contact Maro.':'Your answers could not be sent. Please try again.';btn.disabled=back.disabled=false;btn.textContent='Submit my answers ♡';}}

function show(r){let s=r.score;let msg=s===qs.length?"You're basically me at this point. 💋":s>=17?'Certified Maro expert.':s>=12?'Okay, our friendship is safe.':s>=7?'We need to talk.':'Do I even know you? 💀';app.innerHTML=`<div class="ribbon">🎀</div><div class="eyebrow">Your final result</div><h2>${esc(r.name)}, the verdict is in!</h2><div class="score">${s}<small style="font-size:25px">/${qs.length}</small></div><h2>${esc(msg)}</h2><p>Thanks for being part of my chapter 21. ♡</p><p class="muted">Your attempt is complete. No retakes.</p>${r.preview?'<p class="muted">Local preview only: answers were not sent to Maro.</p>':''}`}
try{let r=JSON.parse(localStorage.getItem(key));if(r&&typeof r.score==='number'){submitted=true;show(r)}else welcome()}catch(e){welcome()}
